<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find the AI tools you didn't know existed. AI Radar searches a live index of AI websites."
    />
    <title>AI Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0e11'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%23e0b15a'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <script>
      // Restore the path after GitHub Pages serves 404.html for a client route.
      ;(function (locationRef) {
        if (locationRef.search[1] === '/') {
          var decoded = locationRef.search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', locationRef.pathname.slice(0, -1) + decoded + locationRef.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
